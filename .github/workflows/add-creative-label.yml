name: Add creative label

on:
  push:
    paths:
      - '.github/workflows/add-creative-label.yml'

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Creative label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<span class="eyebrow">Bookwright · manuscript companion</span>'
          new = '<span class="eyebrow">Bookwright · manuscript companion · <span style="color:#ff1f1f;font-weight:700;">Creative</span></span>'
          if old not in s:
              raise SystemExit('Target label not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Creative to Bookwright header'
          git push
